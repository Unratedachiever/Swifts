# Base44 dev environment — SwiftShip Logistics.
#
# The PREVIEW APP IS THE PHP PORT (plain PHP + PDO + SQLite) in ./php.
# `php -S` serves it straight from the bind-mounted source, so every edit shows
# up on the next request — no build step, no prebuilt image.
#
# Mailpit is the local SMTP sink: every welcome email is captured and readable at
# https://8025-${BASE44_PUBLIC_HOST_SUFFIX} — no external credentials needed to
# see the branded email working.
#
# The original TanStack Start app is still runnable behind the "node" profile:
#   docker compose -f docker-compose.base44.yml --profile node up -d node
services:
  php:
    image: php:8.3-cli
    working_dir: /app
    restart: on-failure
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/app/php/public", "/app/php/public/index.php"]
    ports:
      # Preview contract: the app listens on 8080 inside the container.
      - "3000:8080"
    volumes:
      - .:/app
      # SQLite lives on a volume so accounts and shipments survive a restart.
      - php-data:/data
    environment:
      - APP_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - DB_PATH=/data/app.sqlite
      # The built-in server is single-process by default, which serializes the
      # page's images/styles behind each other and can stall the preview iframe.
      - PHP_CLI_SERVER_WORKERS=6
    # Local dev defaults first, platform-delivered secrets LAST so a real value
    # (SMTP_HOST/USER/PASS …) always wins over the placeholder.
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    restart: on-failure
    ports:
      # Inbox UI — open https://8025-${BASE44_PUBLIC_HOST_SUFFIX}
      - "8025:8025"
    environment:
      - MP_MAX_MESSAGES=200
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/api/v1/info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Legacy Node/TanStack Start app (opt-in) ────────────────────────────────
  node:
    image: node:22-bookworm-slim
    profiles: ["node"]
    working_dir: /app
    restart: on-failure
    ports:
      - "3001:8080"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CI=true
      - VITE_AUTH_ENABLED=true
      - BETTER_AUTH_URL=https://3001-${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 240s

volumes:
  node_modules:
  php-data:
