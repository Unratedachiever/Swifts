# Base44 dev environment for SwiftShip Logistics.
#
# Runs the project's own Vite dev server straight from the cloned source
# (bind-mounted at /app) so edits appear live in the preview — no prebuilt
# application image, no production Dockerfile.
#
# No external services are needed to boot:
#   * DATABASE_URL is intentionally unset, so src/lib/db.ts uses the app's
#     embedded PGlite database and applies migrations/*.sql on first query.
#   * Better Auth falls back to its preview mode (per-process signing secret,
#     local email/password sign-in enabled in src/lib/auth/email-password.ts).
services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: on-failure
    ports:
      # Preview contract: the app listens on 8080 inside the container.
      - "3000:8080"
    volumes:
      - .:/app
      # Dependencies live in a named volume (the bind mount would hide them);
      # they are installed from the lockfile on startup, below.
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CI=true
      - VITE_AUTH_ENABLED=true
      # Base64 preview host != any host Better Auth trusts by default, and the
      # app's own preview allowlist only covers *.grok-sandbox.com. Pin the
      # app's origin to the preview's public origin, otherwise email/password
      # sign-in/sign-up is rejected with "Invalid origin".
      - BETTER_AUTH_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      # Platform-provided: Vite appends it to server.allowedHosts so the dev
      # server answers the proxied preview hostname (which rotates).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    # Platform-delivered secrets (empty until you add some on the dashboard);
    # listed last so a real value always wins over anything above.
    env_file:
      - /run/base44/app.env
    # Install/refresh dependencies from the pinned lockfile after the mounts are
    # in place, then exec the dev server so it is PID 1 and restarts cleanly.
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    # Probes real application responsiveness: "/" is SSR and runs a server
    # function that touches the database.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      # npm ci + Vite + PGlite bootstrap on a cold start.
      start_period: 240s

volumes:
  node_modules:
